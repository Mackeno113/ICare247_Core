<title>No-code hay Bespoke</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#f5f2ec; --surface:#fffdf9; --surface-2:#efeae1;
    --ink:#1c1a16; --muted:#6c665b; --faint:#948d80;
    --line:#d8d2c6; --line-soft:#e7e1d6;
    --accent:#b3261e;
    /* mức triển khai — màu ngữ nghĩa, tách khỏi accent */
    --lv-nocode:#1f6b3f;   --lv-nocode-bg:#e6f1e9;
    --lv-hybrid:#8a6100;   --lv-hybrid-bg:#fbf1d8;
    --lv-bespoke:#b3261e;  --lv-bespoke-bg:#f8e9e6;
    --lv-external:#3a5a78; --lv-external-bg:#e6edf3;
    --shadow:0 1px 2px rgba(28,26,22,.05), 0 8px 28px -18px rgba(28,26,22,.30);
    --sans:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:"Spectral",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#171512; --surface:#201d18; --surface-2:#262218;
      --ink:#ece6da; --muted:#a69e8f; --faint:#7d7568;
      --line:#37322a; --line-soft:#2a261f;
      --accent:#e46f64;
      --lv-nocode:#6cc08d;   --lv-nocode-bg:#16281d;
      --lv-hybrid:#d3a44f;   --lv-hybrid-bg:#2a2113;
      --lv-bespoke:#e46f64;  --lv-bespoke-bg:#2c1a17;
      --lv-external:#8fb0cc; --lv-external-bg:#1a2530;
      --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#171512; --surface:#201d18; --surface-2:#262218;
    --ink:#ece6da; --muted:#a69e8f; --faint:#7d7568;
    --line:#37322a; --line-soft:#2a261f;
    --accent:#e46f64;
    --lv-nocode:#6cc08d;   --lv-nocode-bg:#16281d;
    --lv-hybrid:#d3a44f;   --lv-hybrid-bg:#2a2113;
    --lv-bespoke:#e46f64;  --lv-bespoke-bg:#2c1a17;
    --lv-external:#8fb0cc; --lv-external-bg:#1a2530;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 30px -18px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
  .mono{font-family:var(--mono)}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:3px}
  ::selection{background:var(--lv-bespoke-bg); color:var(--ink)}

  .shell{max-width:1080px; margin:0 auto; padding:0 22px}

  /* top strip */
  .strip{border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:30}
  .strip-in{display:flex; align-items:center; gap:14px; padding:12px 22px; max-width:1080px; margin:0 auto}
  .mark{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; white-space:nowrap}
  .mark::before{content:"▍"; margin-right:6px}
  .strip .spacer{flex:1}
  .strip .doc-v{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.04em}
  .theme-btn{font-family:var(--mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; background:transparent; color:var(--muted); border:1px solid var(--line); padding:5px 10px; cursor:pointer; border-radius:3px}
  .theme-btn:hover{color:var(--ink); border-color:var(--faint)}

  /* hero */
  header.hero{padding:56px 0 26px}
  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:0 0 18px}
  h1{font-family:var(--serif); font-weight:700; font-size:clamp(2.2rem,5.5vw,3.7rem); line-height:1.03; letter-spacing:-.015em; margin:0 0 20px; text-wrap:balance; max-width:18ch}
  .lede{font-size:clamp(1.02rem,2.3vw,1.22rem); color:var(--muted); max-width:64ch; margin:0}
  .lede b{color:var(--ink); font-weight:600}
  .hero-meta{display:flex; flex-wrap:wrap; gap:9px 24px; margin-top:28px; font-family:var(--mono); font-size:12px; color:var(--faint); letter-spacing:.03em}
  .hero-meta b{color:var(--muted); font-weight:600}

  /* summary tiles */
  .tiles{display:grid; gap:1px; grid-template-columns:repeat(2,1fr); background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:8px 0 28px}
  @media (min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{background:var(--surface); padding:18px 18px 16px; position:relative}
  .tile .top{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .tile .dot{width:10px; height:10px; border-radius:3px; flex-shrink:0}
  .tile .lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .tile .v{font-family:var(--serif); font-weight:700; font-size:2rem; line-height:1; font-variant-numeric:tabular-nums}
  .tile .sub{font-size:.8rem; color:var(--faint); margin-top:5px}

  /* filter bar */
  .filterbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 8px; padding:14px 0; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); position:sticky; top:49px; background:var(--paper); z-index:20}
  .filterbar .flabel{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-right:4px}
  .chip{font-family:var(--sans); font-size:.84rem; font-weight:500; border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:6px 13px; border-radius:20px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:border-color .15s, color .15s, background .15s}
  .chip .cdot{width:9px; height:9px; border-radius:3px}
  .chip:hover{color:var(--ink); border-color:var(--faint)}
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .chip[aria-pressed="true"] .cdot{outline:1.5px solid var(--paper); outline-offset:1px}

  /* group section */
  section.grp{padding:34px 0 8px; border-bottom:1px solid var(--line-soft)}
  section.grp.dim{opacity:.32}
  .grp-head{display:flex; align-items:flex-start; gap:16px; margin-bottom:16px}
  .grp-code{font-family:var(--serif); font-weight:700; font-size:2.2rem; line-height:.9; color:var(--accent); flex-shrink:0; width:1.4em; text-align:center}
  .grp-title{font-family:var(--serif); font-weight:600; font-size:1.42rem; letter-spacing:-.01em; margin:0 0 3px; line-height:1.15}
  .grp-note{font-size:.92rem; color:var(--muted); margin:0; max-width:60ch}
  .grp-count{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap; padding-top:6px}

  .tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
  table{width:100%; border-collapse:collapse; font-size:.93rem; background:var(--surface); min-width:660px}
  th{text-align:left; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--surface-2)}
  td{padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr.hidden{display:none}
  td.feat{font-weight:600; width:30%}
  td.reuse{color:var(--muted); font-size:.88rem; width:32%}
  td.rnote{color:var(--muted); font-size:.88rem}
  td .code{font-family:var(--mono); font-size:.82em; color:var(--accent); font-weight:600}

  /* level pill */
  .pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap}
  .pill .pdot{width:7px; height:7px; border-radius:50%}
  .lv-nocode{color:var(--lv-nocode); background:var(--lv-nocode-bg)} .lv-nocode .pdot{background:var(--lv-nocode)}
  .lv-hybrid{color:var(--lv-hybrid); background:var(--lv-hybrid-bg)} .lv-hybrid .pdot{background:var(--lv-hybrid)}
  .lv-bespoke{color:var(--lv-bespoke); background:var(--lv-bespoke-bg)} .lv-bespoke .pdot{background:var(--lv-bespoke)}
  .lv-external{color:var(--lv-external); background:var(--lv-external-bg)} .lv-external .pdot{background:var(--lv-external)}

  /* generic section */
  section.block{padding:44px 0; border-bottom:1px solid var(--line-soft)}
  .sec-eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 14px; display:flex; gap:10px}
  .sec-eyebrow .n{color:var(--faint)}
  h2{font-family:var(--serif); font-weight:600; font-size:clamp(1.5rem,3.4vw,2.1rem); line-height:1.12; letter-spacing:-.01em; margin:0 0 18px; text-wrap:balance; max-width:24ch}
  p{margin:0 0 14px; max-width:66ch}

  /* crosscut list */
  .cc-list{list-style:none; padding:0; margin:18px 0 0; display:grid; gap:11px}
  .cc-list li{display:grid; grid-template-columns:auto 1fr; gap:14px; border:1px solid var(--line); border-left:3px solid var(--accent); background:var(--surface); border-radius:0 6px 6px 0; padding:14px 17px}
  .cc-list .num{font-family:var(--serif); font-weight:700; font-size:1.3rem; color:var(--accent); line-height:1}
  .cc-list .cc-t{font-weight:600; margin:0 0 3px; font-size:1rem}
  .cc-list .cc-d{font-size:.9rem; color:var(--muted); margin:0; max-width:none}
  .cc-list code{font-family:var(--mono); font-size:.82em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  /* estimate bar */
  .est{margin-top:22px}
  .est-bar{display:flex; height:44px; border-radius:8px; overflow:hidden; border:1px solid var(--line)}
  .est-seg{display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--mono); font-size:12px; font-weight:600; min-width:0; padding:0 8px}
  .est-legend{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:12px; font-size:.86rem; color:var(--muted)}
  .est-legend span{display:inline-flex; align-items:center; gap:8px}
  .est-legend .k{width:11px; height:11px; border-radius:3px; flex-shrink:0}

  .reco{border:1px solid var(--line); border-left:3px solid var(--lv-nocode); background:var(--surface); border-radius:0 8px 8px 0; padding:18px 20px; margin-top:24px}
  .reco h3{font-family:var(--serif); margin:0 0 10px; font-size:1.15rem}
  .reco ul{margin:0; padding-left:18px}
  .reco li{margin-bottom:8px; font-size:.94rem; color:var(--muted)}
  .reco li b{color:var(--ink); font-weight:600}

  footer{padding:36px 0 60px; color:var(--faint); font-size:.84rem; font-family:var(--mono); letter-spacing:.03em}
  footer p{max-width:72ch}

  .edit-hint{font-size:.8rem; color:var(--faint); font-family:var(--mono); border:1px dashed var(--line); border-radius:6px; padding:10px 14px; margin-top:20px; max-width:66ch}
</style>

<div class="strip">
  <div class="strip-in">
    <span class="mark">Chung cư × ICare247</span>
    <span class="spacer"></span>
    <span class="doc-v" id="docv"></span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Đổi giao diện sáng/tối">Sáng · Tối</button>
  </div>
</div>

<div class="shell">
  <header class="hero">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroTitle"></h1>
    <p class="lede" id="heroLede"></p>
    <div class="hero-meta" id="heroMeta"></div>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="filterbar" id="filterbar" role="group" aria-label="Lọc theo mức triển khai"></div>

  <main id="matrix"></main>

  <section class="block" id="crosscutBlock">
    <p class="sec-eyebrow"><span class="n">✦</span> <span id="ccEyebrow"></span></p>
    <h2 id="ccTitle"></h2>
    <p id="ccIntro" style="color:var(--muted)"></p>
    <ul class="cc-list" id="ccList"></ul>
  </section>

  <section class="block" id="conclBlock" style="border-bottom:none">
    <p class="sec-eyebrow"><span class="n">→</span> <span id="clEyebrow"></span></p>
    <h2 id="clTitle"></h2>
    <div class="est">
      <div class="est-bar" id="estBar"></div>
      <div class="est-legend" id="estLegend"></div>
    </div>
    <div class="reco" id="reco"></div>
  </section>

  <footer id="foot"></footer>
</div>

/* ===================== RENDER (không cần sửa khi đổi dữ liệu) ===================== */
(function(){
  const $ = s => document.querySelector(s);
  const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
  const L = DATA.levels;

  // hero
  $("#docv").textContent = DATA.meta.version;
  $("#heroEyebrow").textContent = DATA.meta.eyebrow;
  $("#heroTitle").innerHTML = DATA.meta.title;
  $("#heroLede").innerHTML = DATA.meta.lede;
  DATA.meta.meta.forEach(([k,v])=>{ $("#heroMeta").appendChild(el("span",null,`<b>${k}</b> ${v}`)); });

  // counts
  const counts = {nocode:0,hybrid:0,bespoke:0,external:0}; let total=0;
  DATA.groups.forEach(g=>g.items.forEach(it=>{counts[it.level]++; total++;}));

  // tiles
  const tiles = $("#tiles");
  Object.keys(L).forEach(key=>{
    const lv=L[key];
    const t=el("div","tile");
    t.innerHTML = `<div class="top"><span class="dot" style="background:${lv.color}"></span><span class="lab">${lv.label}</span></div>`
      + `<div class="v" style="color:${lv.color}">${counts[key]}</div>`
      + `<div class="sub">${lv.desc}</div>`;
    tiles.appendChild(t);
  });

  // filter chips
  const fb = $("#filterbar");
  fb.appendChild(el("span","flabel","Lọc mức"));
  let active = "all";
  const mkChip=(key,label,color)=>{
    const c=el("button","chip",(color?`<span class="cdot" style="background:${color}"></span>`:"")+label);
    c.type="button"; c.setAttribute("aria-pressed", key==="all"?"true":"false"); c.dataset.k=key;
    c.addEventListener("click",()=>{ active=key; applyFilter(); });
    return c;
  };
  fb.appendChild(mkChip("all",`Tất cả · ${total}`,null));
  Object.keys(L).forEach(key=> fb.appendChild(mkChip(key,`${L[key].label} · ${counts[key]}`,L[key].color)) );

  // matrix
  const matrix = $("#matrix");
  DATA.groups.forEach(g=>{
    const sec=el("section","grp"); sec.dataset.code=g.code;
    const head=el("div","grp-head");
    head.innerHTML = `<span class="grp-code">${g.code}</span>`
      + `<div><h3 class="grp-title">${g.name}</h3><p class="grp-note">${g.note}</p></div>`
      + `<span class="grp-count" data-count></span>`;
    sec.appendChild(head);

    const wrap=el("div","tbl-wrap");
    const tbl=el("table");
    tbl.innerHTML = `<thead><tr><th>Chức năng</th><th>Mức</th><th>Tái dùng của ICare247</th><th>Ghi chú</th></tr></thead>`;
    const tb=el("tbody");
    g.items.forEach(it=>{
      const lv=L[it.level];
      const tr=el("tr"); tr.dataset.level=it.level;
      tr.innerHTML = `<td class="feat">${it.feat}</td>`
        + `<td><span class="pill ${lv.pill}"><span class="pdot"></span>${lv.label}</span></td>`
        + `<td class="reuse">${it.reuse}</td>`
        + `<td class="rnote">${it.note}</td>`;
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); wrap.appendChild(tbl); sec.appendChild(wrap);
    matrix.appendChild(sec);
  });

  function applyFilter(){
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.k===active?"true":"false"));
    document.querySelectorAll("section.grp").forEach(sec=>{
      let shown=0;
      sec.querySelectorAll("tbody tr").forEach(tr=>{
        const hit = active==="all" || tr.dataset.level===active;
        tr.classList.toggle("hidden",!hit); if(hit)shown++;
      });
      sec.classList.toggle("dim", shown===0);
      const cnt=sec.querySelector("[data-count]");
      cnt.textContent = active==="all" ? `${sec.querySelectorAll("tbody tr").length} chức năng` : `${shown} khớp`;
    });
  }
  applyFilter();

  // crosscut
  $("#ccEyebrow").textContent = DATA.crosscut.eyebrow;
  $("#ccTitle").textContent = DATA.crosscut.title;
  $("#ccIntro").textContent = DATA.crosscut.intro;
  const ccl=$("#ccList");
  DATA.crosscut.items.forEach((it,i)=>{
    ccl.appendChild(el("li",null,`<span class="num">${i+1}</span><div><p class="cc-t">${it.t}</p><p class="cc-d">${it.d}</p></div>`));
  });

  // conclusion
  $("#clEyebrow").textContent = DATA.conclusion.eyebrow;
  $("#clTitle").textContent = DATA.conclusion.title;
  const eb=$("#estBar"), leg=$("#estLegend");
  DATA.conclusion.estimate.forEach(s=>{
    const seg=el("div","est-seg",`${s.pct}%`); seg.style.flex=String(s.pct); seg.style.background=s.color; eb.appendChild(seg);
    leg.appendChild(el("span",null,`<span class="k" style="background:${s.color}"></span>${s.label} · ${s.pct}%`));
  });
  const reco=$("#reco");
  reco.appendChild(el("h3",null,DATA.conclusion.reco.title));
  const ul=el("ul"); DATA.conclusion.reco.points.forEach(p=>ul.appendChild(el("li",null,p))); reco.appendChild(ul);
  reco.appendChild(el("p","edit-hint","✎ Trang này tự dựng từ khối <b>DATA</b> ở đầu &lt;script&gt;. Sửa quy tắc/hàng/mức tại đó — không cần đụng HTML."));

  $("#foot").innerHTML = `<p>${DATA.footer}</p>`;

  // theme toggle
  const btn=$("#themeBtn");
  const sysDark=()=>window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
  btn.addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const isDark=cur?cur==="dark":sysDark();
    document.documentElement.setAttribute("data-theme",isDark?"light":"dark");
  });
})();
</script>
